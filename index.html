<style>
:root{
  color-scheme:light;
  --bg:#f5f6f8; --bar:#ffffff; --surface:#ffffff; --surface2:#eceef2;
  --ink:#12141a; --muted:#5f6573; --line:#dcdfe6; --accent:#1b4fa3;
  --hand:#d97400; --go:#188a40; --go-bg:#dcf3e4; --pause-bg:#fdebd0;
  --brk:#1e78c8; --danger:#c93636; --tick:#b3b8c4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --bar:#12141a; --surface:#12141a; --surface2:#1c1d21;
    --ink:#ffffff; --muted:#8e93a0; --line:#25272d; --accent:#a8c7fa;
    --hand:#ffa000; --go:#30d158; --go-bg:#0f2517; --pause-bg:#2a1c05;
    --brk:#64b5f6; --danger:#ff6b6b; --tick:#4a4d55;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --bar:#12141a; --surface:#12141a; --surface2:#1c1d21;
  --ink:#ffffff; --muted:#8e93a0; --line:#25272d; --accent:#a8c7fa;
  --hand:#ffa000; --go:#30d158; --go-bg:#0f2517; --pause-bg:#2a1c05;
  --brk:#64b5f6; --danger:#ff6b6b; --tick:#4a4d55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;line-height:1.5;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bar);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{margin:0;font-size:21px;font-weight:800;color:var(--accent);letter-spacing:0}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:600;max-width:150px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.theme{direction:ltr;position:relative;width:62px;height:34px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);flex:none}
.theme .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#e9c46a;color:#3b2a00;display:grid;place-items:center;font-size:15px;transition:transform .2s}
.theme .knob::before{content:'☀'}
.theme[aria-checked="true"] .knob{transform:translateX(28px);background:#1b3a6e;color:#fff}
.theme[aria-checked="true"] .knob::before{content:'☾'}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.icon-btn svg{width:22px;height:22px;fill:currentColor}

main{flex:1;padding:0 16px 104px}

/* pomodoro phase chips */
.phases{display:flex;gap:8px;justify-content:center;padding-top:14px}
.phases button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.phases button.on{color:var(--ink);border-color:var(--go);background:var(--go-bg)}
.phases button.on[data-ph="short"],.phases button.on[data-ph="long"]{border-color:var(--brk);background:transparent;color:var(--brk)}

/* dial */
.pager{position:relative;width:min(100%,400px);aspect-ratio:1;margin:14px auto 0;touch-action:pan-y}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block}
.slide.digital.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#dial{width:100%;height:100%;display:block;direction:ltr}
#dial text{font-family:inherit}
.t1{stroke:var(--tick);stroke-width:1}
.t2{stroke:var(--ink);stroke-width:1.6;opacity:.75}
.t3{stroke:var(--ink);stroke-width:3.4}
.num{font-weight:800;font-size:27px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.snum{font-weight:700;font-size:11px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.sub-ring{fill:none;stroke:var(--tick);stroke-width:1}
.stick{stroke:var(--ink);stroke-width:1.2}
.dial-time{font-weight:800;font-size:31px;fill:var(--ink);text-anchor:middle;font-variant-numeric:tabular-nums}
.ph-name{font-weight:800;font-size:21px;fill:var(--ink);text-anchor:middle}
.ph-cyc{font-weight:600;font-size:12px;fill:var(--muted);text-anchor:middle}
.ring-bg{fill:none;stroke:var(--line);stroke-width:5}
.ring-fg{fill:none;stroke:var(--go);stroke-width:5;stroke-linecap:round}
.ring-fg.brk{stroke:var(--brk)}
.hand-line{stroke:var(--hand);stroke-width:4;stroke-linecap:round}
.hand-hub{fill:var(--bg);stroke:var(--hand);stroke-width:3}
.sub-hand{stroke:var(--hand);stroke-width:2.2;stroke-linecap:round}
#bigTime{font-size:clamp(44px,14.5vw,76px);font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;line-height:1.1}
#bigSub{color:var(--muted);font-weight:600;font-size:17px}
.dots{display:flex;gap:14px;justify-content:center;padding:10px 0 0}
.dots button{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots button.on{background:var(--ink)}

/* controls */
.ctrls{direction:ltr;display:flex;justify-content:space-between;padding:26px 6px 0}
.round{width:96px;height:96px;border-radius:50%;border:2px solid var(--line);background:var(--surface2);font-size:20px;font-weight:700;transition:transform .12s}
.round:active:not([disabled]){transform:scale(.95)}
.round[disabled]{opacity:.45;cursor:default}
.round.go{background:var(--go-bg);color:var(--go);border-color:var(--go)}
.round.pause{background:var(--pause-bg);color:var(--hand);border-color:var(--hand)}

.btn{padding:9px 18px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:700}
.btn.wide{display:block;width:100%;margin-top:16px;padding:12px}
.btn.primary{background:var(--go-bg);border-color:var(--go);color:var(--go)}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:4px 2px}

/* laps */
.laps{list-style:none;margin:16px 0 0;padding:0}
.laps li{display:grid;grid-template-columns:1fr auto auto;gap:16px;padding:12px 4px;border-top:1px solid var(--line);font-weight:600}
.laps li:last-child{border-bottom:1px solid var(--line)}
.laps .t{direction:ltr;font-variant-numeric:tabular-nums}
.laps .tot{color:var(--muted);min-width:82px;text-align:left}
.laps li.best .t:nth-child(2){color:var(--go)}
.laps li.worst .t:nth-child(2){color:var(--danger)}
.laps li.cur{font-weight:800}

/* pomodoro panel */
.field{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline-offset:2px}
.field::placeholder{color:var(--muted)}
#pmExtra{padding-top:22px}
.cycrow{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.cyc{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;font-weight:600}
.cyc i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.cyc i.done{background:var(--go);border-color:var(--go)}
.cyc i.now{border-color:var(--go)}
.tip{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--brk);color:var(--ink);font-size:15px}
.tip b{color:var(--brk)}
h3{font-size:16px;margin:26px 0 10px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600}
.chips button.on{border-color:var(--accent);color:var(--accent)}
.st,.setrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);gap:12px}
.steps .st:last-child{border-bottom:1px solid var(--line)}
.stepper{direction:ltr;display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font-size:20px;line-height:1}
.stepper output{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sw{direction:ltr;position:relative;width:46px;height:27px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw[aria-checked="true"]{background:var(--go-bg);border-color:var(--go)}
.sw[aria-checked="true"]::after{transform:translateX(19px);background:var(--go)}
.setrow .lb{font-weight:600}
.setrow .sb{font-size:13px;color:var(--muted)}
.soundbox{padding-top:8px}
.vol{display:flex;align-items:center;gap:12px;margin-top:12px;color:var(--muted);font-size:14px}
.vol input{flex:1;accent-color:var(--hand)}
.saverow{margin-top:14px}

/* stats */
.stats section{padding:20px 0;border-top:1px solid var(--line)}
.stats section:first-child{border-top:0}
.stats h2{margin:0 0 12px;font-size:16px;font-weight:700}
.today{display:flex;align-items:center;gap:20px}
.today svg{width:112px;height:112px;flex:none}
.big{font-size:34px;font-weight:800;line-height:1.15}
.mut{color:var(--muted);font-size:14px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.trio div+div{border-inline-start:1px solid var(--line)}
.trio b{display:block;font-size:20px;font-weight:800;white-space:nowrap}
.trio span{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{font-family:inherit;font-size:11px;fill:var(--muted);text-anchor:middle}
.blist{list-style:none;margin:0;padding:0}
.blist li{padding:7px 0}
.blist .hd{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
.blist .bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
.blist .bar i{display:block;height:100%;border-radius:4px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.log .m{flex:1;min-width:0}
.log .m b{font-size:14px}
.log .m small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .d{font-weight:700;font-size:14px;white-space:nowrap}
.x{width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:20px;line-height:1}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty p{margin:0 0 14px}

/* todo */
.tlist{list-style:none;margin:16px 0 0;padding:0}
.tlist li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line)}
.tlist li:last-child{border-bottom:1px solid var(--line)}
.tchk{width:23px;height:23px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.tchk.on{background:var(--go);border-color:var(--go);color:#fff}
.tchk svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tbody{flex:1;min-width:0}
.ttxt{font-weight:600;font-size:15px;overflow-wrap:break-word}
.ttxt.done{color:var(--muted);text-decoration:line-through}
.tsub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.tplay{width:32px;height:32px;border-radius:50%;background:var(--surface2);color:var(--go);display:grid;place-items:center;flex:none}
.tplay svg{width:15px;height:15px;fill:currentColor}
.tsec-h{font-size:13px;color:var(--muted);font-weight:700;margin:22px 0 0;display:flex;justify-content:space-between;align-items:center}
.tsec-h button{color:var(--muted);font-size:13px;font-weight:600}

/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--bar);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px 8px;color:var(--muted);font-size:13px;font-weight:600;position:relative}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--hand)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:86dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0}
.sheet h2{margin:0 0 6px;font-size:19px}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 14px}
.sl{list-style:none;margin:8px 0 0;padding:0}
.sl li{display:flex;align-items:center;border-top:1px solid var(--line)}
.pick{flex:1;display:flex;align-items:center;gap:10px;padding:13px 2px;font-weight:600;text-align:start}
.pick.on{color:var(--accent)}
.pick .ck{margin-inline-start:auto}
.addrow{display:flex;gap:8px;margin-top:14px}
.danger{color:var(--danger)}
.ta{min-height:96px;direction:ltr;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;margin-top:10px}
.sheet h3{margin:20px 0 8px}
.hint{color:var(--muted);font-size:13px;margin-top:14px}

.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">مذاكرتي</h1>
    <button class="chip" id="subjBtn" aria-label="اختار المادة"><i class="dot" id="subjDot"></i><span id="subjName"></span></button>
    <span class="grow"></span>
    <button class="theme" id="themeBtn" role="switch" aria-checked="true" aria-label="الوضع الليلي"><span class="knob"></span></button>
    <button class="icon-btn" id="menuBtn" aria-label="الإعدادات"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </header>

  <main>
    <section id="viewTimer">
      <div class="phases" id="phases" hidden>
        <button data-ph="focus">تركيز</button>
        <button data-ph="short">راحة قصيرة</button>
        <button data-ph="long">راحة طويلة</button>
      </div>

      <div class="pager" id="pager">
        <div class="slide on" id="slideDial">
          <svg id="dial" viewBox="-12 -12 424 424" role="img" aria-label="ساعة توقيت">
            <g id="ring" style="display:none">
              <circle class="ring-bg" cx="200" cy="200" r="203"/>
              <circle id="ringFg" class="ring-fg" cx="200" cy="200" r="203" transform="rotate(-90 200 200)"/>
            </g>
            <g id="face"></g>
            <g id="subdial"></g>
            <g id="phaseInfo" style="display:none">
              <text class="ph-name" id="phName" x="200" y="114">تركيز</text>
              <text class="ph-cyc" id="phCyc" x="200" y="138"></text>
            </g>
            <text class="dial-time" id="dialTime" x="200" y="262">00:00.00</text>
            <g id="hand">
              <line class="hand-line" x1="200" y1="226" x2="200" y2="14"/>
              <circle class="hand-hub" cx="200" cy="200" r="7"/>
            </g>
          </svg>
        </div>
        <div class="slide digital" id="slideDigi">
          <div id="bigTime">00:00.00</div>
          <div id="bigSub"></div>
        </div>
      </div>
      <div class="dots" role="tablist" aria-label="طريقة العرض">
        <button class="on" data-view="dial" aria-label="ساعة"></button>
        <button data-view="digi" aria-label="أرقام كبيرة"></button>
      </div>

      <div class="ctrls">
        <button class="round" id="btnL">لفّة</button>
        <button class="round go" id="btnR">ابدأ</button>
      </div>

      <div id="swExtra">
        <div class="saverow" id="saveRow" hidden><button class="btn wide primary" id="saveBtn"></button></div>
        <ul class="laps" id="laps"></ul>
      </div>

      <div id="pmExtra" hidden>
        <input id="noteIn" class="field" maxlength="80" placeholder="هتذاكر إيه في الجلسة دي؟ (اختياري)" aria-label="هدف الجلسة">
        <div class="cycrow">
          <div class="cyc" id="cyc"></div>
          <button class="link" id="distBtn">شتّتني (<span id="distN">0</span>)</button>
        </div>
        <div class="tip" id="tip" hidden></div>
        <div style="margin-top:8px"><button class="link" id="pmReset">صفّر الجلسة دي</button></div>

        <h3>ظبّط الوقت</h3>
        <div class="chips" id="presets">
          <button data-preset="25,5,15,4">كلاسيك 25 / 5</button>
          <button data-preset="50,10,20,3">مكثّف 50 / 10</button>
          <button data-preset="90,20,30,2">ماراثون 90 / 20</button>
        </div>
        <div class="steps" style="margin-top:12px">
          <div class="st"><span>تركيز</span><div class="stepper"><button data-cfg="focus" data-d="-5" aria-label="أقل">−</button><output id="o-focus"></output><button data-cfg="focus" data-d="5" aria-label="أكتر">+</button></div></div>
          <div class="st"><span>راحة قصيرة</span><div class="stepper"><button data-cfg="short" data-d="-1" aria-label="أقل">−</button><output id="o-short"></output><button data-cfg="short" data-d="1" aria-label="أكتر">+</button></div></div>
          <div class="st"><span>راحة طويلة</span><div class="stepper"><button data-cfg="long" data-d="-5" aria-label="أقل">−</button><output id="o-long"></output><button data-cfg="long" data-d="5" aria-label="أكتر">+</button></div></div>
          <div class="st"><span>جلسات قبل الراحة الطويلة</span><div class="stepper"><button data-cfg="cycles" data-d="-1" aria-label="أقل">−</button><output id="o-cycles"></output><button data-cfg="cycles" data-d="1" aria-label="أكتر">+</button></div></div>
          <div class="setrow"><span class="lb">ابدأ اللي بعده تلقائي</span><button class="sw" role="switch" data-tog="auto" aria-label="ابدأ اللي بعده تلقائي"></button></div>
        </div>
      </div>

      <div class="soundbox">
        <h3>صوت الخلفية</h3>
        <div class="chips" id="amb">
          <button data-amb="off">صامت</button>
          <button data-amb="brown">بنّي</button>
          <button data-amb="white">أبيض</button>
          <button data-amb="rain">مطر</button>
        </div>
        <div class="vol"><span>الصوت</span><input type="range" id="vol" min="5" max="100" step="5" aria-label="مستوى الصوت"></div>
      </div>
    </section>

    <section id="viewStats" class="stats" hidden></section>

    <section id="viewTodo" hidden>
      <div class="addrow" style="margin-top:14px">
        <input id="todoIn" class="field" maxlength="120" placeholder="ضيف مهمة جديدة" aria-label="اسم المهمة">
        <button class="btn" id="todoAddBtn">ضيف</button>
      </div>
      <div id="todoBody"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="التنقّل">
    <button class="tab" data-tab="stopwatch"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4.2l2.6 1.6M9.5 2.8h5"/></svg>ساعة إيقاف</button>
    <button class="tab" data-tab="pomodoro"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 6c0-1.8 1.3-3 3.2-3M8.6 3.9c1.3.3 2.6 1.1 3.4 2.1"/></svg>بومودورو</button>
    <button class="tab" data-tab="todo"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/><circle cx="3" cy="6" r="0" fill="none"/></svg>مهامي</button>
    <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20v-9M12 20V5M19 20v-6"/></svg>إحصائياتي</button>
  </nav>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var NS='http://www.w3.org/2000/svg';
var store={
  get:function(k,d){try{var v=localStorage.getItem('mz1:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem('mz1:'+k,JSON.stringify(v))}catch(e){}}
};
var pad=function(n){return String(n).padStart(2,'0')};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var clamp=function(v,a,b){return Math.min(b,Math.max(a,v))};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- data ---------- */
var PALETTE=['#ffa000','#30d158','#64b5f6','#f06fa8','#b388ff','#26c6da','#ff7043','#c0ca33'];
var PH={focus:'تركيز',short:'راحة قصيرة',long:'راحة طويلة'};
var TIPS=[
  'قوم اتمطّى وحرّك رقبتك وكتافك.',
  'اشرب مياه، المخ محتاجها.',
  'بُصّ لحاجة بعيدة 20 ثانية وريّح عينيك.',
  'خد 5 أنفاس عميقة: شهيق 4 ثواني وزفير 6.',
  'امشي شوية بعيد عن الشاشة.',
  'الراحة الحقيقية من غير موبايل، جرّب.',
  'اكتب من ذاكرتك أهم 3 حاجات خدتها في الجلسة اللي فاتت.',
  'اشرح اللي ذاكرته بصوت عالي كأنك بتعلّمه لحد.'
];
var RANGE={focus:[5,120],short:[1,30],long:[5,60],cycles:[2,8],goal:[15,720]};
var DEF={focus:25,short:5,long:15,cycles:4,auto:true,sound:true,notify:false,wake:false,goal:180,ambient:'off',vol:40};

var subjects=store.get('subjects',null)||[{id:'gen',name:'مذاكرة عامة',color:PALETTE[0]}];
var subjId=store.get('subj','gen');
if(!subjects.some(function(s){return s.id===subjId})) subjId=subjects[0].id;
var sessions=store.get('sessions',[]);
var todos=store.get('todos',[]);
var cfg=Object.assign({},DEF,store.get('cfg',{}));
var ui=Object.assign({tab:'stopwatch',view:'dial',theme:'dark'},store.get('ui',{}));
var sw=Object.assign({running:false,start:0,base:0,laps:[]},store.get('sw',{}));
var pm=store.get('pm',null);
var ms=function(m){return Math.round(m*60000)};
var phaseTotal=function(ph){return ms(cfg[ph])};
if(!pm||!pm.phase){pm={phase:'focus',cycle:1,running:false,end:0,left:phaseTotal('focus'),total:phaseTotal('focus'),dist:0,note:'',tip:''}}

function saveAll(){store.set('sw',sw);store.set('pm',pm)}
function saveCfg(){store.set('cfg',cfg)}
function saveUi(){store.set('ui',ui)}
function saveSessions(){if(sessions.length>3000)sessions=sessions.slice(-3000);store.set('sessions',sessions)}
function saveTodos(){if(todos.length>500)todos=todos.slice(-500);store.set('todos',todos)}
function saveSubjects(){store.set('subjects',subjects);store.set('subj',subjId)}

var swElapsed=function(){return sw.running?sw.base+(Date.now()-sw.start):sw.base};
var pmLeft=function(){return pm.running?Math.max(0,pm.end-Date.now()):pm.left};
var subj=function(){return subjects.filter(function(s){return s.id===subjId})[0]||subjects[0]};

function fmtSW(t){
  var cs=Math.floor(t/10)%100,s=Math.floor(t/1000)%60,m=Math.floor(t/60000)%60,h=Math.floor(t/3600000);
  return (h?h+':'+pad(m):pad(m))+':'+pad(s)+'.'+pad(cs);
}
function fmtCD(t){
  var x=Math.ceil(t/1000),s=x%60,m=Math.floor(x/60)%60,h=Math.floor(x/3600);
  return h?h+':'+pad(m)+':'+pad(s):pad(m)+':'+pad(s);
}
function fmtDur(sec){
  sec=Math.round(sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  if(h)return h+' س'+(m?' '+m+' د':'');
  if(m)return m+' د';
  return sec+' ث';
}
function fmtShort(sec){
  if(sec<=0)return '';
  if(sec<3600)return Math.round(sec/60)+'د';
  return (sec/3600).toFixed(1).replace('.0','')+'س';
}

/* ---------- dial ---------- */
function el(name,attrs,parent){var e=document.createElementNS(NS,name);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function polar(cx,cy,r,deg){var a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function buildDial(){
  var face=$('#face'),i,p,q;
  for(i=0;i<240;i++){
    var deg=i*1.5,r1,cls;
    if(i%20===0){r1=170;cls='t3'}else if(i%4===0){r1=178;cls='t2'}else{r1=183;cls='t1'}
    p=polar(200,200,190,deg);q=polar(200,200,r1,deg);
    el('line',{x1:p[0].toFixed(2),y1:p[1].toFixed(2),x2:q[0].toFixed(2),y2:q[1].toFixed(2),'class':cls},face);
  }
  for(i=0;i<12;i++){
    p=polar(200,200,146,i*30);
    var t=el('text',{x:p[0].toFixed(1),y:p[1].toFixed(1),'class':'num'},face);
    t.textContent=i===0?'60':String(i*5);
  }
  var sd=$('#subdial');
  el('circle',{cx:200,cy:120,r:50,'class':'sub-ring'},sd);
  for(i=0;i<30;i++){
    var len=i%5===0?9:5;
    p=polar(200,120,50,i*12);q=polar(200,120,50-len,i*12);
    el('line',{x1:p[0].toFixed(2),y1:p[1].toFixed(2),x2:q[0].toFixed(2),y2:q[1].toFixed(2),'class':'stick'},sd);
    if(i%5===0){
      var l=polar(200,120,33,i*12);
      var tx=el('text',{x:l[0].toFixed(1),y:l[1].toFixed(1),'class':'snum'},sd);

function nextPhase(auto){
  var ph;
  if(pm.phase==='focus'){ph=pm.cycle>=cfg.cycles?'long':'short'}
  else{ph='focus';pm.cycle=pm.phase==='long'?1:Math.min(pm.cycle+1,cfg.cycles)}
  pm.phase=ph;pm.total=phaseTotal(ph);pm.left=pm.total;pm.dist=0;
  pm.running=!!(auto&&cfg.auto);
  if(pm.running)pm.end=Date.now()+pm.left;

}

  if(pm.phase==='focus')logFocus(pm.total-pmLeft());

  alertUser(wasFocus?'خلّصت جلسة تركيز. خد راحتك':'الراحة خلصت. يلا نرجع نركّز');

/* ---------- audio / alerts ---------- */
var ac=null,amb=null,ambKind='';
function ctx(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}
  if(ac&&ac.state==='suspended'){try{ac.resume()}catch(e){}}
  return ac;
}
function beep(){
  var c=ctx();if(!c)return;var t0=c.currentTime;
  [0,0.24,0.48].forEach(function(d,i){
    var o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.value=i===2?988:784;
    g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(0.35,t0+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.21);
    o.connect(g);g.connect(c.destination);o.start(t0+d);o.stop(t0+d+0.23);
  });
}
function alertUser(msg){
  toast(msg);
  if(cfg.sound)beep();
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  try{if(cfg.notify&&window.Notification&&Notification.permission==='granted')new Notification('مذاكرتي',{body:msg})}catch(e){}
}
var AMB_GAIN={white:0.25,brown:0.7,rain:0.6};
function startAmb(kind){
  var c=ctx();if(!c)return;
  var len=c.sampleRate*4,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0),i,last=0;
  if(kind==='brown'){for(i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2}}
  else{for(i=0;i<len;i++)d[i]=Math.random()*2-1}
  var src=c.createBufferSource();src.buffer=buf;src.loop=true;
  var out=src;
  if(kind==='rain'){var f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=0.35;src.connect(f);out=f}
  var g=c.createGain();g.gain.value=(cfg.vol/100)*AMB_GAIN[kind];
  out.connect(g);g.connect(c.destination);src.start();
  amb={src:src,g:g};ambKind=kind;
}
function stopAmb(){if(amb){try{amb.src.stop()}catch(e){}amb=null;ambKind=''}}
function syncAmbient(){
  var want=cfg.ambient!=='off'&&(sw.running||(pm.running&&pm.phase==='focus'));
  if(want){
    if(!amb||ambKind!==cfg.ambient){stopAmb();startAmb(cfg.ambient)}
    else amb.g.gain.value=(cfg.vol/100)*AMB_GAIN[ambKind];
  }else stopAmb();
}

    if(want&&!wl&&navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}
    else if(!want&&wl){wl.release();wl=null}
  }catch(e){}
}

  }else if(sheet==='set'){
    h+='<h2>الإعدادات</h2>'+
      tog('sound','تنبيه صوتي','نغمة لما الجلسة أو الراحة تخلص')+
      tog('notify','إشعارات المتصفح','بتوصلك حتى لو التبويب مش قدامك')+
      tog('wake','خلّي الشاشة صاحية','وإنت شغّال المؤقّت')+
      '<div class="setrow"><div><div class="lb">الهدف اليومي</div></div><div class="stepper"><button data-cfg="goal" data-d="-15" aria-label="أقل">−</button><output>'+fmtDur(cfg.goal*60)+'</output><button data-cfg="goal" data-d="15" aria-label="أكتر">+</button></div></div>'+
      '<div class="setrow"><div><div class="lb">المواد</div></div><button class="btn" data-open="subj">إدارة المواد</button></div>'+
      '<div class="setrow"><div><div class="lb">نسخة احتياطية</div><div class="sb">انسخ بياناتك أو استرجعها</div></div><button class="btn" data-open="bk">افتح</button></div>'+
      '<div class="setrow"><div><div class="lb danger">مسح كل البيانات</div><div class="sb">الجلسات والإعدادات والمواد</div></div><button class="btn danger" data-wipe>امسح</button></div>'+
      '<p class="hint">اختصارات الكيبورد: المسطرة للبدء والإيقاف، والحرف L للفّة.</p>';
  }
  else if(sheet==='bk'){
    h+='<h2>نسخة احتياطية</h2><p class="hint" style="margin-top:0">انسخ بياناتك وابعتها لنفسك (واتساب مثلا)، وبعدين الصقها هنا في أي جهاز عشان ترجّعها.</p>'+
      '<button class="btn wide primary" data-bk-copy style="margin-top:8px">انسخ بياناتي</button>'+
      '<textarea id="bkOut" class="field ta" readonly hidden aria-label="نص النسخة الاحتياطية"></textarea>'+
      '<h3>استرجاع</h3><textarea id="bkIn" class="field ta" placeholder="الصق النسخة هنا" aria-label="الصق النسخة الاحتياطية"></textarea>'+
      '<button class="btn wide" data-bk-restore>استرجع</button>'+
      '<p class="hint">الاسترجاع بيستبدل الجلسات والمواد والإعدادات الحالية.</p>';
  }
  b.innerHTML=h;
}
function openSheet(k){sheet=k;$('#sheet').hidden=false;document.body.style.overflow='hidden';renderSheet();setTimeout(function(){var f=$('#sheetBody button.pick, #sheetBody .sw, #sheetBody input');if(f)f.focus()},30)}
function closeSheet(){sheet=null;$('#sheet').hidden=true;document.body.style.overflow='';renderSubjChip();if(ui.tab==='stats')renderStats()}

/* ---------- backup ---------- */
function buildBackup(){return JSON.stringify({app:'mozakraty',v:1,data:{subjects:subjects,subj:subjId,sessions:sessions,cfg:cfg}})}
function copyBackup(){
  var txt=buildBackup();
  function fallback(){var o=$('#bkOut');if(!o)return;o.hidden=false;o.value=txt;o.focus();o.select();toast('النسخ التلقائي مش متاح. انسخ النص اللي ظهر بإيدك')}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('اتنسخت. الصقها في مكان آمن')},fallback);return;
    }
  }catch(e){}
  fallback();
}
function restoreBackup(btn){
  var raw=($('#bkIn').value||'').trim(),o;
  try{o=JSON.parse(raw)}catch(e){toast('النص ده مش نسخة صالحة');return}
  var d=o&&o.app==='mozakraty'&&o.data;
  if(!d||!Array.isArray(d.sessions)||!Array.isArray(d.subjects)){toast('النص ده مش نسخة من مذاكرتي');return}
  var okColor=function(c){return /^#[0-9a-f]{3,8}$/i.test(c)?c:PALETTE[0]};
  var subs=d.subjects.filter(function(s){return s&&typeof s.id==='string'&&typeof s.name==='string'}).map(function(s){return{id:s.id.slice(0,40),name:s.name.slice(0,30),color:okColor(s.color)}});
  if(!subs.length){toast('النسخة مفيهاش مواد');return}
  var sess=d.sessions.filter(function(s){return s&&typeof s.ts==='number'&&typeof s.dur==='number'}).map(function(s){
    return{id:String(s.id||uid()).slice(0,40),ts:s.ts,kind:s.kind==='focus'?'focus':'sw',dur:Math.max(0,Math.round(s.dur)),dist:Number(s.dist)||0,note:String(s.note||'').slice(0,80),sn:String(s.sn||'').slice(0,30),sc:okColor(s.sc)}
  });
  if(!btn.dataset.armed){
    btn.dataset.armed='1';btn.textContent='هيستبدل بياناتك الحالية. اضغط تاني للتأكيد';
    setTimeout(function(){if(btn.isConnected){delete btn.dataset.armed;btn.textContent='استرجع'}},5000);return;
  }
  var c=Object.assign({},DEF,d.cfg&&typeof d.cfg==='object'?d.cfg:{});
  store.set('subjects',subs);store.set('subj',subs.some(function(s){return s.id===d.subj})?d.subj:subs[0].id);
  store.set('sessions',sess);store.set('cfg',c);
  location.reload();
}

/* ---------- home-screen widget (Android app only, no-op on web) ---------- */
function syncWidget(){
  try{
    if(!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()))return;
    var p=window.Capacitor.Plugins&&window.Capacitor.Plugins.MozakratyWidget;
    if(!p)return;
    p.sync({
      running:!!pm.running,
      phase:pm.phase,
      endEpochMs:pm.running?pm.end:0,
      leftMs:pmLeft(),
      cycle:pm.cycle,
      totalCycles:cfg.cycles
    });
  }catch(e){}
}

/* ---------- loop ---------- */
var raf=0;
function anyRunning(){return sw.running||pm.running}
function tick(){
  if(pm.running&&Date.now()>=pm.end){
    pmComplete();saveAll();commitView();
  }
  renderTimer();
}
function loop(){raf=0;tick();if(anyRunning()&&!document.hidden)raf=requestAnimationFrame(loop)}
function kick(){if(!raf)raf=requestAnimationFrame(loop)}
function commitView(){
  if(ui.tab==='stats'){renderStats()}else{renderControls();syncPm();if(ui.tab==='stopwatch')renderLaps()}
  syncAmbient();syncWake();
}
function commit(){saveAll();commitView();renderTimer();syncWidget();kick()}
function primary(){
  ctx();
  if(ui.tab==='stopwatch'){sw.running?swPause():swStart()}
  else if(ui.tab==='pomodoro'){pm.running?pmPause():pmStart()}
  else return;
  commit();
}
function secondary(){
  if(ui.tab==='stopwatch'){
    if(sw.running)swLap();else if(swElapsed()>0)swReset();else return;
  }else if(ui.tab==='pomodoro'){pmSkip()}
  else return;
  commit();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==='btnR')return primary();
  if(t.id==='btnL')return secondary();
  if(t.id==='saveBtn'){swSaveSession();return commit()}
  if(t.id==='pmReset'){pmReset();return commit()}
  if(t.id==='distBtn'){pm.dist++;saveAll();return syncPm()}
  if(t.id==='subjBtn')return openSheet('subj');
  if(t.id==='menuBtn')return openSheet('set');
  if(t.id==='themeBtn')return setTheme(ui.theme==='dark'?'light':'dark');
  if(t.id==='todoAddBtn'){var ti=$('#todoIn');addTodo(ti.value);ti.value='';ti.focus();return}
  if(t.dataset.tdone)return toggleTodo(t.dataset.tdone);
  if(t.dataset.tdel)return deleteTodo(t.dataset.tdel);
  if(t.dataset.tplay)return startTodoFocus(t.dataset.tplay);
  if(t.dataset.tab)return setTab(t.dataset.tab);
  if(t.dataset.go)return setTab(t.dataset.go);
  if(t.dataset.view)return setView(t.dataset.view);
  if(t.dataset.ph){pmGoto(t.dataset.ph);return commit()}
  if(t.dataset.preset){
    var p=t.dataset.preset.split(',').map(Number);
    cfg.focus=p[0];cfg.short=p[1];cfg.long=p[2];cfg.cycles=p[3];
    saveCfg();applyCfgToIdle();return commit();
  }
  if(t.dataset.amb){cfg.ambient=t.dataset.amb;saveCfg();ctx();syncAmbient();return syncPm()}
  if(t.dataset.cfg){
    var k=t.dataset.cfg,r=RANGE[k];
    cfg[k]=clamp(cfg[k]+Number(t.dataset.d),r[0],r[1]);
    saveCfg();applyCfgToIdle();
    if(sheet==='set')renderSheet();
    return commit();
  }
  if(t.dataset.tog){
    var key=t.dataset.tog;
    if(key==='notify'&&!cfg.notify){
      try{
        if(!window.Notification){toast('المتصفح ده مش بيدعم الإشعارات');return}
        Notification.requestPermission().then(function(res){
          if(res==='granted'){cfg.notify=true;saveCfg();syncToggles()}else toast('المتصفح مانع الإشعارات');
        });
      }catch(err){toast('مش قادر أفعّل الإشعارات هنا')}
      return;
    }
    cfg[key]=!cfg[key];saveCfg();syncToggles();
    if(key==='wake')syncWake();
    if(key==='sound'&&cfg.sound){ctx();beep()}
    return;
  }
  if(t.dataset.pick){subjId=t.dataset.pick;saveSubjects();renderSubjChip();renderSheet();commit();return}
  if(t.dataset.rm){
    subjects=subjects.filter(function(s){return s.id!==t.dataset.rm});
    if(subjId===t.dataset.rm)subjId=subjects[0].id;
    saveSubjects();renderSubjChip();renderSheet();commit();return;
  }
  if(t.hasAttribute('data-add'))return addSubject();
  if(t.hasAttribute('data-bk-copy'))return copyBackup();
  if(t.hasAttribute('data-bk-restore'))return restoreBackup(t);
  if(t.dataset.open)return openSheet(t.dataset.open);
  if(t.hasAttribute('data-wipe')){
    if(t.dataset.armed){
      try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('mz1:')===0)localStorage.removeItem(k)})}catch(err){}
      location.reload();
    }else{
      t.dataset.armed='1';t.textContent='تأكيد؟ اضغط تاني';
      setTimeout(function(){if(t.isConnected){delete t.dataset.armed;t.textContent='امسح'}},4000);
    }
    return;
  }
  if(t.dataset.del){
    sessions=sessions.filter(function(s){return s.id!==t.dataset.del});
    saveSessions();return renderStats();
  }
});
function addSubject(){
  var inp=$('#newSubj'),n=inp.value.trim();
  if(!n){inp.focus();return}
  if(subjects.some(function(s){return s.name===n})){toast('المادة دي موجودة');return}
  var s={id:uid(),name:n,color:PALETTE[subjects.length%PALETTE.length]};
  subjects.push(s);subjId=s.id;saveSubjects();renderSubjChip();renderSheet();commit();
  var ni=$('#newSubj');if(ni)ni.focus();
}
$('#sheet').addEventListener('click',function(e){if(e.target===$('#sheet'))closeSheet()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sheet){closeSheet();return}
  if(e.key==='Enter'&&e.target.id==='newSubj'){addSubject();return}
  if(e.key==='Enter'&&e.target.id==='todoIn'){addTodo(e.target.value);e.target.value='';return}
  if(sheet||ui.tab==='stats')return;
  if(e.target.matches&&e.target.matches('input,textarea'))return;
  if(e.code==='Space'){if(e.target.closest&&e.target.closest('button'))return;e.preventDefault();primary()}
  else if(e.key==='l'||e.key==='L'){secondary()}
});
$('#noteIn').addEventListener('input',function(e){pm.note=e.target.value;saveAll()});
$('#vol').addEventListener('input',function(e){cfg.vol=Number(e.target.value);saveCfg();syncAmbient()});
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();kick();syncWake()}});
/* swipe between dial and digits */
(function(){
  var x0=null,pg=$('#pager');
  pg.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  pg.addEventListener('touchend',function(e){
    if(x0==null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;
    if(Math.abs(dx)>50)setView(ui.view==='dial'?'digi':'dial');
  },{passive:true});
})();

/* ---------- boot ---------- */
buildDial();
setTheme(ui.theme);
renderSubjChip();
if(pm.running&&Date.now()>=pm.end){
  var over=Date.now()-pm.end;
  if(over<10*60000)pmComplete();
  else{pm.running=false;pm.total=phaseTotal(pm.phase);pm.left=pm.total}
  saveAll();
}
applyTab();
syncAmbient();syncWake();syncWidget();
if(anyRunning())kick();
setInterval(tick,500);
})();
</script>
</body>
</html>
